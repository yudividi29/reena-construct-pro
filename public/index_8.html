        const STAGES = [
            { id: 'prep', num: 1, name: 'Persiapan & Pengukuran', unit: 'm¹', desc: 'Pengukuran site & pemasangan papan bowplank kayu keliling.' },
            { id: 'excavation', num: 2, name: 'Galian Tanah Pondasi', unit: 'm³', desc: 'Galian tanah pondasi batu kali trapesium (+ cakar ayam jika bertingkat).' },
            { id: 'foundation', num: 3, name: 'Pondasi Batu Kali & Tapak', unit: 'm³', desc: 'Pasangan batu kali 1:4 (+ pondasi cakar ayam bertulang jika bertingkat).' },
            { id: 'sloof', num: 4, name: 'Sloof Beton Bertulang', unit: 'm³', desc: 'Sloof bawah pengikat pondasi (Kolom praktis/Utama).' },
            { id: 'column', num: 5, name: 'Kolom Struktur Beton', unit: 'm³', desc: 'Kolom tegak penyangga vertikal bangunan.' },
            { id: 'beam', num: 6, name: 'Balok Ring Top / Lantai', unit: 'm³', desc: 'Balok horizontal pengikat dinding & penopang atap/lantai.' },
            { id: 'slab', num: 7, name: 'Plat Lantai / Dak Beton', unit: 'm³', desc: 'Pengecoran dak lantai beton (Khusus Bangunan Bertingkat ≥2 Lantai).' },
            { id: 'wall', num: 8, name: 'Dinding & Plesteran', unit: 'm²', desc: 'Pasangan dinding & plester acian 2 muka (Luar & Dalam).' },

        ];

        const FORMULA_EXPLANATIONS = {
            prep: {
                pengertian: "Menghitung total panjang papan ukur (bowplank) keliling tapak bangunan ditambah ruang gerak/offset.",
                formula1: "K = 2 × (P + L) + 6 m",
                formulaMulti: "K = 2 × (P + L) + 6 m",
                note1: "Offset kerja standar adalah 1.5m di setiap sisi luar tapak tanah.",
                noteMulti: "CATATAN: Bangunan bertingkat menggunakan acuan ukuran perimeter tapak dasar yang sama dengan 1 lantai."
            },
            excavation: {
                pengertian: "Menghitung total volume rongga tanah yang digali untuk mendudukkan pondasi batu kali beserta pondasi cakar ayam.",
                formula1: "V = 2 × (P + L) × ((L_atas + L_bawah)/2) × T_galian",
                formulaMulti: "V = [2 × (P + L) × ((L_atas + L_bawah)/2) × T_galian] + [N × (P_cakar × L_cakar × T_cakar)]",
                note1: "Rumus 1 lantai hanya menghitung volume parit trapesium batu kali.",
                noteMulti: "CATATAN: Bangunan bertingkat WAJIB ditambah galian berbentuk kubus untuk cakar ayam di setiap (N) titik kolom!"
            },
            foundation: {
                pengertian: "Menghitung isi/volume pasangan batu belah dan susunan beton tapak bertulang penahan beban struktur di atas tanah.",
                formula1: "V = 2 × (P + L) × ((L_atas + L_bawah)/2) × T_pondasi",
                formulaMulti: "V = V_batu_kali + [N × (P_plat × L_plat × T_plat)]",
                note1: "Pondasi batu kali belah menerus dengan spesi 1:4.",
                noteMulti: "CATATAN: Bangunan bertingkat mutlak dikombinasikan dengan Pondasi Tapak (Footplate Beton) di setiap (N) titik kolom."
            },
            sloof: {
                pengertian: "Menghitung volume beton cor balok mendatar di atas pondasi yang mengikat kolom.",
                formula1: "V = 2 × (P + L) × b × h  (b=0.15m, h=0.20m)",
                formulaMulti: "V = 2 × (P + L) × b × h  (b=0.20m, h=0.30m)",
                note1: "Sloof rumah standar 1 lantai berdimensi 15x20 cm dengan pembesian D10.",
                noteMulti: "CATATAN: Sloof bangunan bertingkat WAJIB diperbesar ukurannya menjadi minimal 20x30 cm dengan tulangan utama D12."
            },
            column: {
                pengertian: "Menghitung volume beton cor tiang-tiang tegak penyangga beban vertikal rumah.",
                formula1: "V = b × h × T_kolom × N × JL  (Dimensi 15/15cm, JL=1)",
                formulaMulti: "V = b × h × T_kolom × N × JL  (Dimensi 25/25cm)",
                note1: "Kolom 1 lantai menggunakan jenis kolom praktis sebagai pengaku pasangan dinding.",
                noteMulti: "CATATAN: Kolom bertingkat menjadi Kolom Utama yang jauh lebih besar dan dimensinya dikalikan dengan Jumlah Lantai (JL)."
            },
            beam: {
                pengertian: "Menghitung volume beton cor balok mendatar atas penopang beban dak lantai atau rangka atap.",
                formula1: "V = 2 × (P + L) × b × h × JL  (Ring Balk 15/20cm, JL=1)",
                formulaMulti: "V = 2 × (P + L) × b × h × JL  (Balok Induk 20/35cm)",
                note1: "Ring Balk 1 lantai hanya berfungsi sebagai pengunci dinding sebelum atap.",
                noteMulti: "CATATAN: Bangunan bertingkat menggunakan Balok Induk yang harus kuat menopang beban dak beton (dikalikan per lantai/JL)."
            },
            slab: {
                pengertian: "Menghitung volume cor lantai beton pemisah antar tingkat bangunan.",
                formula1: "V = 0 m³ (Tidak ada pengerjaan dak lantai pada rumah 1 tingkat)",
                formulaMulti: "V = P × L × T_dak × (JL - 1)  (T_dak standar = 0.12m)",
                note1: "Volume = 0. Langsung lompat ke pekerjaan dinding/atap.",
                noteMulti: "CATATAN: Mengecor lantai dengan ketebalan 12 cm. Jumlah dak adalah (Jumlah Lantai dikurangi 1)."
            },
            wall: {
                pengertian: "Menghitung total luas bidang tegak pasangan dinding beserta lapisan plester acian.",
                formula1: "Luas = 2 × (P + L) × T_dinding × JL × 2 Muka  (JL=1)",
                formulaMulti: "Luas = 2 × (P + L) × T_dinding × JL × 2 Muka",
                note1: "Dihitung untuk 2 sisi (muka luar dan muka dalam).",
                noteMulti: "CATATAN: Total luas keliling dikalikan merata secara kumulatif dengan Jumlah Lantai (JL)."
            },
            roof: {
                pengertian: "Menghitung luas penutup atap bidang datar, DITAMBAH overstek (tritisan) agar air hujan tidak mengenai dinding.",
                formula1: "Luas = ((P + 2m) × (L + 2m)) / cos(30°)",
                formulaMulti: "Luas = ((P + 2m) × (L + 2m)) / cos(30°)",
                note1: "Sudut kemiringan standar 30° (cos 30 = 0.866). Ditambah overstek atap 1 meter ke setiap sisi luar bangunan (Kanan-Kiri-Depan-Belakang).",
                noteMulti: "CATATAN: Atap penutup luar tetap dihitung 1 luasan (hanya untuk lantai puncak) ditambah overstek 1m keliling."
            },
            mep: {
                pengertian: "Menghitung jumlah total titik kelistrikan dan perpipaan utilitas.",
                formula1: "Total = N_titik_input × JL  (JL=1)",
                formulaMulti: "Total = N_titik_input × JL",
                note1: "Mencakup titik saklar, stopkontak, fitting lampu, dan kran air.",
                noteMulti: "CATATAN: Asumsi penyebaran titik utilitas dikalikan sesuai dengan Jumlah Lantai (JL)."
            },
            ceiling: {
                pengertian: "Menghitung luas penutup langit-langit interior (plafon) ruangan.",
                formula1: "Luas = P × L × JL  (JL=1)",
                formulaMulti: "Luas = P × L × JL",
                note1: "Luas plafon dihitung flat sesuai luas tapak bangunan.",
                noteMulti: "CATATAN: Luas dasar plafon dikalikan kumulatif dengan Jumlah Lantai (JL)."
            },
            floor: {
                pengertian: "Menghitung luas pekerjaan lapisan penutup lantai (keramik/granit/vinyl).",
                formula1: "Luas = P × L × JL  (JL=1)",
                formulaMulti: "Luas = P × L × JL",
                note1: "Luas penutup lantai dasar.",
                noteMulti: "CATATAN: Luas penutup lantai dikalikan jumlah lantai bangunan (JL)."
            },
            finishing: {
                pengertian: "Menghitung total luas bidang tembok yang dicat dasar dan cat akhir (2 muka).",
                formula1: "Luas = 2 × (P + L) × T_dinding × JL × 2 Muka  (JL=1)",
                formulaMulti: "Luas = 2 × (P + L) × T_dinding × JL × 2 Muka",
                note1: "Volume pengecatan mengikuti besaran volume luasan dinding.",
                noteMulti: "CATATAN: Total luas dinding yang akan dicat dikalikan merata dengan Jumlah Lantai (JL)."
            }
        };

        const calculateVolume = (stageId, fields) => {
            const p = parseFloat(fields.p) || 0;
            const l = parseFloat(fields.l) || 0;
            const t = parseFloat(fields.t) || 0;
            const n = parseFloat(fields.n) || 1;
            const floors = parseInt(fields.floors) || 1;
            let vol = 0;

            switch(stageId) {
                case 'prep': vol = (2 * (p + l)) + 6; break;
                case 'excavation': 
                    if (floors === 1) vol = (2 * (p + l)) * ((0.80 + 0.60) / 2) * 0.80;
                    else vol = ((2 * (p + l)) * ((0.80 + 0.60) / 2) * 0.80) + (n * (1.2 * 1.2 * 1.2));
                    break;
                case 'foundation': 
                    if (floors === 1) vol = (2 * (p + l)) * ((0.30 + 0.70) / 2) * 0.60;
                    else vol = ((2 * (p + l)) * ((0.30 + 0.70) / 2) * 0.60) + (n * (1.0 * 1.0 * 0.25 + 0.25 * 0.25 * 0.50));
                    break;
                case 'sloof': 
                    if (floors === 1) vol = (2 * (p + l)) * 0.15 * 0.20; 
                    else vol = (2 * (p + l)) * 0.20 * 0.30; 
                    break;
                case 'column': 
                    if (floors === 1) vol = 0.15 * 0.15 * t * n; 
                    else vol = 0.25 * 0.25 * t * n * floors; 
                    break;
                case 'beam': 
                    if (floors === 1) vol = (2 * (p + l)) * 0.15 * 0.20; 
                    else vol = (2 * (p + l)) * 0.20 * 0.35 * floors; 
                    break;
                case 'slab':
                    if (floors === 1) vol = 0; 
                    else vol = p * l * 0.12 * (floors - 1); 
                    break;
                case 'wall': vol = (2 * (p + l) * t * floors) * 2; break; 
                case 'roof': vol = ((p + 2) * (l + 2)) / Math.cos(30 * (Math.PI / 180)); break; 
                case 'mep': vol = n * floors; break;
                case 'ceiling': vol = p * l * floors; break;
                case 'floor': vol = p * l * floors; break;
                case 'finishing': vol = (2 * (p + l) * t * floors) * 2; break; 
                default: vol = 0;
            }
            return vol;
        };

        const getCoefficients = (stageId, config, floors) => {
            const isMulti = floors > 1;
            
            if (stageId === 'prep') return { materials: [{ id: 'papan_bowplank', qty: 0.2 }, { id: 'kayu_kaso', qty: 0.012 }, { id: 'paku', qty: 0.02 }], labor: [{ id: 'pekerja', qty: 0.1 }, { id: 'tukang', qty: 0.1 }] };
            if (stageId === 'excavation') return { materials: [], labor: [{ id: 'pekerja', qty: 0.75 }, { id: 'mandor', qty: 0.025 }] };
            if (stageId === 'foundation') {
                if (!isMulti) return { materials: [{ id: 'batu_kali', qty: 1.2 }, { id: 'semen', qty: 3.25 }, { id: 'pasir_pasang', qty: 0.52 }], labor: [{ id: 'pekerja', qty: 1.5 }, { id: 'tukang', qty: 0.75 }, { id: 'mandor', qty: 0.075 }] };
                else return { materials: [{ id: 'batu_kali', qty: 0.8 }, { id: 'ready_mix', qty: 0.4 }, { id: 'besi_d12', qty: 18 }, { id: 'semen', qty: 2.1 }, { id: 'pasir_pasang', qty: 0.35 }], labor: [{ id: 'pekerja', qty: 1.8 }, { id: 'tukang', qty: 0.9 }, { id: 'mandor', qty: 0.09 }] };
            }
            if (stageId === 'sloof' || stageId === 'column' || stageId === 'beam' || stageId === 'slab') {
                const mainIron = isMulti ? 'besi_d12' : 'besi_d10';
                return { materials: [{ id: 'ready_mix', qty: 1.02 }, { id: mainIron, qty: isMulti ? 42 : 32 }, { id: 'besi_d8', qty: 14 }, { id: 'kawat_bendrat', qty: 0.4 }, { id: 'bekisting', qty: 2.8 }], labor: [{ id: 'pekerja', qty: 2.4 }, { id: 'tukang', qty: 1.4 }, { id: 'mandor', qty: 0.12 }] };
            }
            if (stageId === 'wall') {
                if (config.dinding === 'hebel') return { materials: [{ id: 'hebel', qty: 8.5 }, { id: 'semen_instan', qty: 0.12 }, { id: 'semen', qty: 0.18 }, { id: 'pasir_pasang', qty: 0.028 }], labor: [{ id: 'pekerja', qty: 0.25 }, { id: 'tukang', qty: 0.15 }, { id: 'mandor', qty: 0.015 }] };
                else if (config.dinding === 'bata_merah') return { materials: [{ id: 'bata_merah', qty: 70 }, { id: 'semen', qty: 0.28 }, { id: 'pasir_pasang', qty: 0.045 }], labor: [{ id: 'pekerja', qty: 0.35 }, { id: 'tukang', qty: 0.18 }, { id: 'mandor', qty: 0.02 }] };
                else return { materials: [{ id: 'batako', qty: 13.5 }, { id: 'semen', qty: 0.16 }, { id: 'pasir_pasang', qty: 0.03 }], labor: [{ id: 'pekerja', qty: 0.3 }, { id: 'tukang', qty: 0.15 }, { id: 'mandor', qty: 0.015 }] };
            }
            if (stageId === 'roof') {
                if (config.atap === 'spandek_baja') return { materials: [{ id: 'baja_ringan', qty: 0.85 }, { id: 'spandek', qty: 1.05 }, { id: 'paku', qty: 0.05 }], labor: [{ id: 'pekerja', qty: 0.18 }, { id: 'tukang', qty: 0.22 }, { id: 'mandor', qty: 0.01 }] };
                else if (config.atap === 'genteng_baja') return { materials: [{ id: 'baja_ringan', qty: 0.95 }, { id: 'genteng_keramik', qty: 11.5 }, { id: 'paku', qty: 0.05 }], labor: [{ id: 'pekerja', qty: 0.22 }, { id: 'tukang', qty: 0.25 }, { id: 'mandor', qty: 0.015 }] };
                else return { materials: [{ id: 'baja_ringan', qty: 0.8 }, { id: 'atap_metal', qty: 1.05 }, { id: 'paku', qty: 0.05 }], labor: [{ id: 'pekerja', qty: 0.18 }, { id: 'tukang', qty: 0.2 }, { id: 'mandor', qty: 0.01 }] };
            }
            if (stageId === 'mep') return { materials: [{ id: 'pipa_pvc', qty: 0.1 }, { id: 'kabel', qty: 1 }], labor: [{ id: 'pekerja', qty: 0.2 }, { id: 'tukang_ahli', qty: 0.4 }, { id: 'mandor', qty: 0.02 }] };
            if (stageId === 'ceiling') {
                if (config.plafon === 'pvc') return { materials: [{ id: 'pvc_plafon', qty: 1.05 }, { id: 'hollow_galvalum', qty: 1.8 }, { id: 'paku', qty: 0.03 }], labor: [{ id: 'pekerja', qty: 0.12 }, { id: 'tukang', qty: 0.18 }, { id: 'mandor', qty: 0.01 }] };
                else return { materials: [{ id: 'gypsum', qty: 0.36 }, { id: 'hollow_galvalum', qty: 1.8 }, { id: 'paku', qty: 0.04 }], labor: [{ id: 'pekerja', qty: 0.12 }, { id: 'tukang', qty: 0.20 }, { id: 'mandor', qty: 0.01 }] };
            }
            if (stageId === 'floor') {
                if (config.lantai === 'granit_60') return { materials: [{ id: 'granit', qty: 0.35 }, { id: 'semen', qty: 0.22 }, { id: 'pasir_pasang', qty: 0.045 }, { id: 'semen_nat', qty: 0.5 }], labor: [{ id: 'pekerja', qty: 0.25 }, { id: 'tukang', qty: 0.25 }, { id: 'mandor', qty: 0.015 }] };
                else if (config.lantai === 'vinyl') return { materials: [{ id: 'vinyl', qty: 1.05 }, { id: 'lem_vinyl', qty: 0.35 }], labor: [{ id: 'pekerja', qty: 0.12 }, { id: 'tukang', qty: 0.18 }, { id: 'mandor', qty: 0.01 }] };
                else return { materials: [{ id: 'keramik', qty: 1.05 }, { id: 'semen', qty: 0.2 }, { id: 'pasir_pasang', qty: 0.045 }, { id: 'semen_nat', qty: 0.5 }], labor: [{ id: 'pekerja', qty: 0.25 }, { id: 'tukang', qty: 0.22 }, { id: 'mandor', qty: 0.015 }] };
            }
            if (stageId === 'finishing') return { materials: [{ id: 'cat_dasar', qty: 0.005 }, { id: 'cat_tembok', qty: 0.012 }, { id: 'plamir', qty: 0.12 }], labor: [{ id: 'pekerja', qty: 0.08 }, { id: 'tukang_cat', qty: 0.15 }, { id: 'mandor', qty: 0.01 }] };
            
            return { materials: [], labor: [] };
        };

        const cb = { x: 300, y: 250 }; 
        const l_pt = { x: 150, y: 175 }; 
        const r_pt = { x: 450, y: 175 }; 
        const ct = { x: 300, y: 100 }; 
        const h = 80; 
        const tcb = { x: 300, y: 250 - h }; 
        const tl = { x: 150, y: 175 - h };  
        const tr = { x: 450, y: 175 - h };  
        const tct = { x: 300, y: 100 - h }; 

        function StageVisualizer({ stageId, fields, viewMode, setViewMode, config }) {
            const p = parseFloat(fields.p) || 10;
            const l_field = parseFloat(fields.l) || 6;
            const t = parseFloat(fields.t) || 3.5;
            const floors = parseInt(fields.floors) || 1;

            return (
                <div className="w-full bg-[#0d1322] rounded-2xl border border-amber-500/30 overflow-hidden shadow-2xl flex flex-col relative print-hide">

                            <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>

                                DIAGRAM {viewMode === 'cross' ? 'POTONGAN DETAIL' : `ISOMETRIC 3D (${floors} LANTAI)`}
                            </span>
                        </div>
                        
                        <div className="flex bg-[#0b0f19] p-1 rounded-xl border border-slate-700 gap-1">
                            <button 
                                onClick={() => setViewMode('cross')} 
                                className={`px-3 py-1.5 text-[10px] font-bold rounded-lg transition-all ${viewMode === 'cross' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-ruler-combined mr-1"></i> Potongan Detail
                            </button>
                            <button 
                                onClick={() => setViewMode('iso')} 
                                className={`px-3 py-1.5 text-[10px] font-bold rounded-lg transition-all ${viewMode === 'iso' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-cube mr-1"></i> Isometric 3D
                            </button>
                        </div>
                    </div>

                    <div className="relative w-full h-[260px] sm:h-[320px] flex items-center justify-center p-4 bg-[#0a0d14] bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px]">
                        <svg className="w-full h-full max-w-[650px] max-h-[300px]" viewBox="0 0 600 300" fill="none">
                            <defs>
                                <linearGradient id="concreteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#64748b" />
                                    <stop offset="100%" stopColor="#334155" />
                                </linearGradient>
                                <linearGradient id="wallFaceTop" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#b45309" />
                                    <stop offset="100%" stopColor="#78350f" />
                                </linearGradient>
                                <linearGradient id="wallFaceSide" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stopColor="#d97706" />
                                    <stop offset="100%" stopColor="#92400e" />
                                </linearGradient>
                            </defs>

                            {viewMode === 'cross' && (
                                <g>
                                    {stageId === 'prep' && (
                                        <g>
                                            <rect x="160" y="80" width="280" height="140" fill="none" stroke="#f59e0b" strokeWidth="2" strokeDasharray="6,4" />
                                            <rect x="120" y="50" width="360" height="200" fill="none" stroke="#38bdf8" strokeWidth="3" />
                                            <circle cx="120" cy="50" r="6" fill="#f59e0b" /><circle cx="480" cy="50" r="6" fill="#f59e0b" />
                                            <circle cx="120" cy="250" r="6" fill="#f59e0b" /><circle cx="480" cy="250" r="6" fill="#f59e0b" />
                                            <text x="300" y="70" fill="#ef4444" fontSize="11" fontWeight="bold" textAnchor="middle">Offset Bowplank 1.5m Keliling</text>
                                            <text x="300" y="150" fill="#f59e0b" fontSize="14" fontWeight="bold" textAnchor="middle">Luas Tapak Bangunan (P: {p}m × L: {l_field}m)</text>
                                        </g>
                                    )}
                                    {stageId === 'excavation' && (
                                        <g>
                                            <line x1="60" y1="80" x2="540" y2="80" stroke="#10b981" strokeWidth="3" />
                                            <text x="90" y="70" fill="#10b981" fontSize="11" fontWeight="bold">Muka Tanah Asli (±0.00)</text>
                                            <polygon points="180,80 420,80 370,240 230,240" fill="#1e293b" stroke="#f59e0b" strokeWidth="3" />
                                            <line x1="180" y1="55" x2="420" y2="55" stroke="#38bdf8" strokeWidth="2" />
                                            <text x="300" y="48" fill="#38bdf8" fontSize="11" fontWeight="bold" textAnchor="middle">Lebar Atas: 80 cm</text>
                                            <line x1="230" y1="260" x2="370" y2="260" stroke="#38bdf8" strokeWidth="2" />
                                            <text x="300" y="278" fill="#38bdf8" fontSize="11" fontWeight="bold" textAnchor="middle">Lebar Bawah: 60 cm</text>
                                            {floors > 1 && (
                                                <g>
                                                    <rect x="250" y="240" width="100" height="40" fill="#0f172a" stroke="#ef4444" strokeWidth="2" strokeDasharray="4,2" />
                                                    <text x="300" y="260" fill="#ef4444" fontSize="10" fontWeight="bold" textAnchor="middle">+ Galian Cakar Ayam</text>
                                                </g>
                                            )}
                                        </g>
                                    )}
                                    {stageId === 'foundation' && (
                                        <g>
                                            <rect x="200" y="220" width="200" height="30" fill="#334155" stroke="#64748b" strokeWidth="1.5" />
                                            <polygon points="250,90 350,90 380,220 220,220" fill="#334155" stroke="#f59e0b" strokeWidth="3" />
                                            <text x="300" y="80" fill="#38bdf8" fontSize="11" fontWeight="bold" textAnchor="middle">Lebar Atas: 30 cm</text>
                                            <text x="300" y="210" fill="#38bdf8" fontSize="11" fontWeight="bold" textAnchor="middle">Lebar Bawah: 70 cm</text>
                                            <text x="300" y="240" fill="#94a3b8" fontSize="10" textAnchor="middle">Pasir Urug + Aanstamping</text>
                                            {floors > 1 && (
                                                <g>
                                                    <rect x="230" y="220" width="140" height="40" fill="#475569" stroke="#ef4444" strokeWidth="2" />
                                                    <text x="300" y="245" fill="#ef4444" fontSize="10" fontWeight="bold" textAnchor="middle">Footplate Beton Besi D12</text>
                                                </g>
                                            )}
                                        </g>
                                    )}
                                    {(stageId === 'sloof' || stageId === 'column' || stageId === 'beam' || stageId === 'slab') && (
                                        <g>
                                            <rect x="230" y="60" width="140" height="180" fill="url(#concreteGrad)" stroke="#f59e0b" strokeWidth="3" />
                                            <rect x="245" y="75" width="110" height="150" fill="none" stroke="#38bdf8" strokeWidth="2.5" strokeDasharray="4,2" />
                                            <circle cx="255" cy="85" r="8" fill="#f59e0b" /><circle cx="345" cy="85" r="8" fill="#f59e0b" />
                                            <circle cx="245" cy="215" r="8" fill="#f59e0b" /><circle cx="345" cy="215" r="8" fill="#f59e0b" />
                                            {floors > 1 && (
                                                <g>
                                                    <circle cx="255" cy="150" r="8" fill="#f59e0b" /><circle cx="345" cy="150" r="8" fill="#f59e0b" />

                                        </g>
                                    )}
                                    {stageId === 'wall' && (
                                        <g>
                                            <rect x="240" y="40" width="120" height="220" fill="#d97706" stroke="#f59e0b" strokeWidth="2" />
                                            <rect x="220" y="40" width="20" height="220" fill="#64748b" stroke="#94a3b8" />
                                            <rect x="360" y="40" width="20" height="220" fill="#64748b" stroke="#94a3b8" />
