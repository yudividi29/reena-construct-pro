                                    {stageId === 'roof' && (
                                        <g>
                                            <polygon points="80,230 300,50 520,230" fill="none" stroke="#f59e0b" strokeWidth="4" />
                                            <line x1="80" y1="230" x2="520" y2="230" stroke="#38bdf8" strokeWidth="3" />
                                            <line x1="300" y1="50" x2="300" y2="230" stroke="#38bdf8" strokeWidth="2" />
                                            <rect x="130" y="200" width="340" height="30" fill="none" stroke="#ef4444" strokeWidth="2" strokeDasharray="4,2" />
                                            <text x="300" y="140" fill="#ffffff" fontSize="13" fontWeight="bold" textAnchor="middle">Rangka: {config.atap.includes('baja') ? 'Baja Ringan C75' : 'Kayu Kaso Borneo'}</text>
                                            <text x="300" y="35" fill="#f59e0b" fontSize="12" fontWeight="bold" textAnchor="middle">Penutup + Overstek 1m Tiap Sisi</text>
                                        </g>
                                    )}
                                    {stageId === 'ceiling' && (
                                        <g>
                                            <rect x="100" y="130" width="400" height="15" fill="#f8fafc" stroke="#38bdf8" strokeWidth="2" />
                                            <line x1="100" y1="110" x2="500" y2="110" stroke="#64748b" strokeWidth="3" strokeDasharray="8,4" />
                                            <text x="300" y="95" fill="#64748b" fontSize="11" textAnchor="middle">Rangka Hollow Galvalum</text>
                                            <text x="300" y="170" fill="#f59e0b" fontSize="13" fontWeight="bold" textAnchor="middle">Penutup: {config.plafon === 'pvc' ? 'Plafon PVC' : (config.plafon === 'gypsum' ? 'Gypsum 9mm' : 'Kalsiboard')}</text>
                                        </g>
                                    )}
                                    {stageId === 'floor' && (
                                        <g>
                                            <rect x="100" y="140" width="400" height="20" fill="#e2e8f0" stroke="#f59e0b" strokeWidth="2" />
                                            <rect x="100" y="160" width="400" height="30" fill="#475569" />
                                            <text x="300" y="125" fill="#38bdf8" fontSize="12" fontWeight="bold" textAnchor="middle">Material: {config.lantai === 'granit_60' ? 'Granit Tile' : (config.lantai === 'vinyl' ? 'Vinyl 3mm' : 'Keramik')}</text>
                                            <text x="300" y="180" fill="#94a3b8" fontSize="10" textAnchor="middle">Spesi Adukan Semen 3cm</text>
                                        </g>
                                    )}
                                    {(stageId === 'mep' || stageId === 'finishing') && (
                                        <g>
                                            <circle cx="300" cy="140" r="50" fill="#f59e0b" fillOpacity="0.2" stroke="#f59e0b" strokeWidth="3" />
                                            <text x="300" y="220" fill="#38bdf8" fontSize="13" fontWeight="bold" textAnchor="middle">{STAGES.find(s=>s.id===stageId)?.name}</text>
                                            <text x="300" y="240" fill="#94a3b8" fontSize="10" textAnchor="middle">Dihitung Kumulatif untuk {floors} Lantai</text>
                                        </g>
                                    )}
                                </g>
                            )}

                            {viewMode === 'iso' && (
                                <g>
                                    <polygon points={`${cb.x},${cb.y} ${l_pt.x},${l_pt.y} ${ct.x},${ct.y} ${r_pt.x},${r_pt.y}`} fill="none" stroke="#1e293b" strokeWidth="1" strokeDasharray="6,4" />
                                    
                                    {stageId === 'prep' && (
                                        <g>
                                            <polygon points={`${cb.x},${cb.y + 10} ${l_pt.x - 15},${l_pt.y} ${ct.x},${ct.y - 10} ${r_pt.x + 15},${r_pt.y}`} fill="none" stroke="#f59e0b" strokeWidth="2" strokeDasharray="5,3" />
                                            <circle cx={cb.x} cy={cb.y + 10} r="3" fill="#ef4444" /><circle cx={l_pt.x - 15} cy={l_pt.y} r="3" fill="#ef4444" />
                                            <circle cx={r_pt.x + 15} cy={r_pt.y} r="3" fill="#ef4444" /><circle cx={ct.x} cy={ct.y - 10} r="3" fill="#ef4444" />
                                        </g>
                                    )}
                                    {stageId === 'excavation' && (
                                        <g>
                                            <polyline points={`${l_pt.x},${l_pt.y} ${cb.x},${cb.y} ${r_pt.x},${r_pt.y}`} fill="none" stroke="#0f172a" strokeWidth="16" />
                                            <polyline points={`${l_pt.x},${l_pt.y} ${cb.x},${cb.y} ${r_pt.x},${r_pt.y}`} fill="none" stroke="#1e293b" strokeWidth="10" />
                                        </g>
                                    )}
                                    {stageId === 'foundation' && (
                                        <polyline points={`${l_pt.x},${l_pt.y} ${cb.x},${cb.y} ${r_pt.x},${r_pt.y}`} fill="none" stroke="#475569" strokeWidth="14" strokeLinecap="square" />
                                    )}
                                    {stageId === 'sloof' && (
                                        <polyline points={`${l_pt.x},${l_pt.y} ${cb.x},${cb.y} ${r_pt.x},${r_pt.y}`} fill="none" stroke="#94a3b8" strokeWidth="6" strokeLinecap="square" />
                                    )}
                                    
                                    {['column', 'beam', 'slab', 'wall', 'roof', 'ceiling', 'finishing', 'mep', 'floor'].includes(stageId) && (
                                        <g>
                                            {Array.from({ length: floors }).map((_, floorIndex) => {
                                                const yOffset = floorIndex * 65; 
                                                const base_cb = { x: cb.x, y: cb.y - yOffset };
                                                const base_l = { x: l_pt.x, y: l_pt.y - yOffset };
                                                const base_r = { x: r_pt.x, y: r_pt.y - yOffset };
                                                const base_ct = { x: ct.x, y: ct.y - yOffset };
                                                
                                                const top_cb = { x: cb.x, y: tcb.y - yOffset };
                                                const top_l = { x: tl.x, y: tl.y - yOffset };
                                                const top_r = { x: tr.x, y: tr.y - yOffset };
                                                const top_ct = { x: tct.x, y: tct.y - yOffset };

                                                return (
                                                    <g key={floorIndex}>
                                                        <line x1={base_ct.x} y1={base_ct.y} x2={top_ct.x} y2={top_ct.y} stroke="#334155" strokeWidth="4" />
                                                        {['wall', 'roof', 'ceiling', 'finishing', 'mep'].includes(stageId) && (
                                                            <g>
                                                                <polygon points={`${base_cb.x},${base_cb.y} ${base_l.x},${base_l.y} ${top_l.x},${top_l.y} ${top_cb.x},${top_cb.y}`} fill={stageId==='finishing' ? '#cbd5e1' : (stageId==='mep' ? '#1e293b' : 'url(#wallFaceSide)')} stroke={stageId==='finishing' ? '#94a3b8' : '#b45309'} strokeWidth="1.5" />
                                                                <polygon points={`${base_cb.x},${base_cb.y} ${base_r.x},${base_r.y} ${top_r.x},${top_r.y} ${top_cb.x},${top_cb.y}`} fill={stageId==='finishing' ? '#e2e8f0' : (stageId==='mep' ? '#0f172a' : 'url(#wallFaceTop)')} stroke={stageId==='finishing' ? '#cbd5e1' : '#92400e'} strokeWidth="1.5" />
                                                            </g>
                                                        )}
                                                        <line x1={base_l.x} y1={base_l.y} x2={top_l.x} y2={top_l.y} stroke={stageId === 'finishing' ? '#cbd5e1' : '#94a3b8'} strokeWidth="6" />
                                                        <line x1={base_r.x} y1={base_r.y} x2={top_r.x} y2={top_r.y} stroke={stageId === 'finishing' ? '#e2e8f0' : '#94a3b8'} strokeWidth="6" />
                                                        <line x1={base_cb.x} y1={base_cb.y} x2={top_cb.x} y2={top_cb.y} stroke={stageId === 'finishing' ? '#cbd5e1' : '#cbd5e1'} strokeWidth="7" />
                                                        
                                                        {['beam', 'slab', 'roof', 'ceiling'].includes(stageId) && (
                                                            <g>
                                                                <polyline points={`${top_l.x},${top_l.y} ${top_cb.x},${top_cb.y} ${top_r.x},${top_r.y}`} fill="none" stroke="#94a3b8" strokeWidth="6" strokeLinecap="square" />
                                                                <polyline points={`${top_l.x},${top_l.y} ${top_ct.x},${top_ct.y} ${top_r.x},${top_r.y}`} fill="none" stroke="#64748b" strokeWidth="4" />
                                                                
                                                                {stageId === 'slab' && floorIndex < floors - 1 && (
                                                                     <polygon points={`${top_cb.x},${top_cb.y} ${top_l.x},${top_l.y} ${top_ct.x},${top_ct.y} ${top_r.x},${top_r.y}`} fill="#38bdf8" fillOpacity="0.4" stroke="#0ea5e9" strokeWidth="2" />
                                                                )}
                                                            </g>
                                                        )}

                                                        {stageId === 'ceiling' && (
                                                            <polygon points={`${top_cb.x},${top_cb.y} ${top_l.x},${top_l.y} ${top_ct.x},${top_ct.y} ${top_r.x},${top_r.y}`} fill="#f8fafc" stroke="#38bdf8" strokeWidth="2" fillOpacity="0.95" />
                                                        )}

                                                        {stageId === 'floor' && (
                                                            <polygon points={`${base_cb.x},${base_cb.y} ${base_l.x},${base_l.y} ${base_ct.x},${base_ct.y} ${base_r.x},${base_r.y}`} fill="#cbd5e1" stroke="#38bdf8" strokeWidth="2" />
                                                        )}

                                                        {stageId === 'mep' && (
                                                            <g>
                                                                <polyline points={`${base_cb.x - 30},${base_cb.y - 15} ${base_cb.x - 30},${base_cb.y - 50} ${base_cb.x - 70},${base_cb.y - 70}`} fill="none" stroke="#ef4444" strokeWidth="2.5" />
                                                                <circle cx={base_cb.x - 70} cy={base_cb.y - 70} r="4" fill="#facc15" />
                                                            </g>
                                                        )}

                                                        {stageId === 'roof' && floorIndex === floors - 1 && (
                                                            <g>
                                                                <polygon points={`${top_cb.x},${top_cb.y + 15} ${top_l.x - 20},${top_l.y + 15} ${300},${top_ct.y - 50}`} fill="#78350f" stroke="#f59e0b" strokeWidth="2" />
                                                                <polygon points={`${top_cb.x},${top_cb.y + 15} ${top_r.x + 20},${top_r.y + 15} ${300},${top_ct.y - 50}`} fill="#92400e" stroke="#f59e0b" strokeWidth="2" />
                                                            </g>
                                                        )}
                                                    </g>
                                                );
                                            })}
                                        </g>
                                    )}

                                    <line x1={l_pt.x - 20} y1={l_pt.y} x2={tl.x - 20} y2={tl.y} stroke="#38bdf8" strokeWidth="2" strokeDasharray="3,3" />
                                    <text x={l_pt.x - 25} y={(l_pt.y + tl.y)/2} fill="#38bdf8" fontSize="11" fontWeight="bold" textAnchor="end">t: {t}m</text>
                                    <line x1={l_pt.x - 10} y1={l_pt.y + 15} x2={cb.x - 10} y2={cb.y + 15} stroke="#10b981" strokeWidth="2.5" />
                                    <text x={(l_pt.x + cb.x)/2 - 10} y={(l_pt.y + cb.y)/2 + 25} fill="#10b981" fontSize="12" fontWeight="bold" transform={`rotate(26.5 ${(l_pt.x + cb.x)/2 - 10},${(l_pt.y + cb.y)/2 + 25})`}>P: {p}m</text>
                                    <line x1={cb.x + 10} y1={cb.y + 15} x2={r_pt.x + 10} y2={r_pt.y + 15} stroke="#f59e0b" strokeWidth="2.5" />
                                    <text x={(cb.x + r_pt.x)/2 + 10} y={(cb.y + r_pt.y)/2 + 25} fill="#f59e0b" fontSize="12" fontWeight="bold" transform={`rotate(-26.5 ${(cb.x + r_pt.x)/2 + 10},${(cb.y + r_pt.y)/2 + 25})`}>L: {l_field}m</text>
                                </g>
                            )}
                        </svg>
                    </div>

                    <div className="p-3 bg-[#131d33] border-t border-slate-800 text-center">
                        <p className="text-[11px] text-slate-300 font-medium">
                            {STAGES.find(s=>s.id===stageId)?.desc}
                        </p>
                    </div>
                </div>
            );
        }

        // Main React App Component
        function App() {
            const [activeTab, setActiveTab] = useState('project');
            const [viewMode, setViewMode] = useState('iso'); 
            const [prices, setPrices] = useState(defaultPrices);
            const [activeStage, setActiveStage] = useState('wall');
            
            const [projectData, setProjectData] = useState({
                name: 'Pembangunan Rumah Modern',
                location: 'Jember, Jawa Timur',
                owner: 'Bpk. Hendra'
            });

            const [config, setConfig] = useState({
                dinding: 'hebel',
                atap: 'spandek_baja',
                lantai: 'granit_60',
                plafon: 'gypsum'
            });
            
            const [calcFields, setCalcFields] = useState({ p: 10, l: 6, t: 3.5, n: 4, floors: 1 });

            // AI Image Upload State
            const [blueprintImg, setBlueprintImg] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analysisDone, setAnalysisDone] = useState(false);

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setBlueprintImg(URL.createObjectURL(file));
                setIsAnalyzing(true);
                setAnalysisDone(false);

                const formData = new FormData();
                formData.append('gambarDenah', file);

                try {
                    const response = await fetch('http://localhost:3000/api/analisa-denah', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === "sukses") {
                        setCalcFields({ 
                            p: result.data.p, 
                            l: result.data.l, 
                            t: result.data.t || 3.5, 
                            n: result.data.n, 
                            floors: result.data.floors || 1 
                        });
                    }
                } catch (error) {
                    alert("Gagal terhubung ke AI. Pastikan server menyala!");
                } finally {
                    setIsAnalyzing(false);
                    setAnalysisDone(true);
                }
            };

            const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val || 0);
            const formatVol = (val) => Number.isInteger(val) ? val : Number(val).toFixed(2);

            const isMultiStory = parseInt(calcFields.floors) > 1;

            const timeline = useMemo(() => {
                const crewSize = 5; 
                let currentDay = 1;
                return STAGES.map(s => {
                    const vol = calculateVolume(s.id, calcFields);
                    const coef = getCoefficients(s.id, config, parseInt(calcFields.floors));
                    let totalOH = 0;
                    if (vol > 0 && coef) {
                        coef.labor.forEach(l => { totalOH += l.qty * vol; });
                    }
                    const duration = Math.max(1, Math.ceil(totalOH / crewSize));
                    const startDay = currentDay;
                    const endDay = currentDay + duration - 1;
                    currentDay = endDay + 1; 
                    return { ...s, startDay, endDay, duration };
                });
            }, [calcFields, config]);

            const globalRAB = useMemo(() => {
                let totalMatAll = 0, totalLabAll = 0;
                const details = [];
                STAGES.forEach(stage => {
                    const vol = calculateVolume(stage.id, calcFields);
                    const coef = getCoefficients(stage.id, config, parseInt(calcFields.floors));
                    let stageMat = 0, stageLab = 0;
                    if (vol > 0 && coef) {
                        coef.materials.forEach(m => {
                            const dbPrice = prices.materials[m.id]?.price || 0;
                            stageMat += Math.round((m.qty * vol) * dbPrice);
                        });
                        coef.labor.forEach(l => {
                            const dbPrice = prices.labor[l.id]?.price || 0;
                            stageLab += Math.ceil(l.qty * vol) * dbPrice;
                        });
                    }
                    totalMatAll += stageMat;
                    totalLabAll += stageLab;
                    details.push({
                        ...stage, volume: vol, matCost: stageMat, labCost: stageLab, totalCost: stageMat + stageLab
                    });
                });
                return { details, totalMatAll, totalLabAll, grandTotal: totalMatAll + totalLabAll };
            }, [calcFields, config, prices]);

            const stageResult = useMemo(() => {
                const volume = calculateVolume(activeStage, calcFields);
                const coef = getCoefficients(activeStage, config, parseInt(calcFields.floors));
                if (!coef || volume <= 0) return { materials: [], labor: [], totalMat: 0, totalLab: 0, grandTotal: 0, volume };

                let totalMat = 0, totalLab = 0;
                const mats = coef.materials.map(m => {
                    const db = prices.materials[m.id];
                    if (!db) return null;
                    const totalQty = m.qty * volume;
                    const cost = Math.round(totalQty * db.price);
                    totalMat += cost;
                    return { id: m.id, name: db.name, qty: totalQty, unit: db.unit, price: db.price, total: cost };
                }).filter(Boolean);
                
                const labs = coef.labor.map(l => {
                    const db = prices.labor[l.id];
                    if (!db) return null;
                    const totalOH = Math.ceil(l.qty * volume);
                    const cost = totalOH * db.price;
                    totalLab += cost;
                    return { id: l.id, name: db.name, qty: totalOH, unit: db.unit, price: db.price, total: cost };
                }).filter(Boolean);

                return { materials: mats, labor: labs, totalMat, totalLab, grandTotal: totalMat + totalLab, volume };
            }, [activeStage, calcFields, config, prices]);

            const handlePriceChange = (category, id, value) => {
                setPrices(prev => ({
                    ...prev,
                    [category]: {
                        ...prev[category],
                        [id]: { ...prev[category][id], price: parseFloat(value) || 0 }
                    }
                }));
            };

            const exportToCSV = () => {
                let csv = "No,Uraian Pekerjaan,Volume,Satuan,Biaya Material,Biaya Upah,Jumlah Total\n";
                globalRAB.details.forEach((row, i) => {
                    csv += `${i+1},"${row.name}",${formatVol(row.volume)},${row.unit},${row.matCost},${row.labCost},${row.totalCost}\n`;
                });
                csv += `,,,TOTAL REKAPITULASI,${globalRAB.totalMatAll},${globalRAB.totalLabAll},${globalRAB.grandTotal}\n`;
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `RAB_Global_${projectData.name}.csv`;
                a.click();
            };

            const currentFormula = FORMULA_EXPLANATIONS[activeStage];

            return (
                <div className="flex flex-col h-screen bg-[#0a0d14] text-xs font-sans text-white overflow-hidden">
                    
                    {/* NAVBAR */}
                    <header className="bg-[#131d33] border-b border-slate-800 p-3 flex flex-col md:flex-row items-center justify-between shrink-0 gap-3 print-hide">
                        <div className="flex items-center gap-3">
                            <div className="bg-amber-500 p-2 rounded-xl text-slate-950 font-bold">
                                <i className="fa-solid font-black fa-building-user text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-sm font-black uppercase text-white tracking-wider">
                                    Reena <span className="text-amber-500">Construct</span> Pro
                                </h1>
                                <p className="text-[10px] text-slate-400">Kalkulator Konstruksi & Edukasi Rumus Bangunan</p>
                            </div>
                        </div>

                        <div className="flex bg-[#0b0f19] p-1 rounded-xl border border-slate-800 overflow-x-auto w-full md:w-auto">
                            <button onClick={() => setActiveTab('project')} className={`flex-1 md:flex-none px-3 py-1.5 rounded-lg font-bold transition ${activeTab === 'project' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-list-check mr-1.5"></i> Proyek & AI
                            </button>
                            <button onClick={() => setActiveTab('calc')} className={`flex-1 md:flex-none px-3 py-1.5 rounded-lg font-bold transition ${activeTab === 'calc' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-calculator mr-1.5"></i> Visual & Rumus
                            </button>
                            <button onClick={() => setActiveTab('rab_stage')} className={`flex-1 md:flex-none px-3 py-1.5 rounded-lg font-bold transition ${activeTab === 'rab_stage' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-layer-group mr-1.5"></i> RAB Tahap
                            </button>
                            <button onClick={() => setActiveTab('rab_global')} className={`flex-1 md:flex-none px-3 py-1.5 rounded-lg font-bold transition ${activeTab === 'rab_global' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-file-invoice-dollar mr-1.5"></i> RAB Global
                            </button>
                            <button onClick={() => setActiveTab('materials')} className={`flex-1 md:flex-none px-3 py-1.5 rounded-lg font-bold transition ${activeTab === 'materials' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>
                                <i className="fa-solid fa-database mr-1.5"></i> Harga Material
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 overflow-hidden flex flex-col">
                        
                        {/* TAB 1: PROYEK ENTRY DENGAN AI UPLOAD */}
                        {activeTab === 'project' && (
                            <div className="flex-1 p-6 overflow-y-auto print-hide">
                                <div className="max-w-4xl mx-auto bg-[#131d33] p-6 rounded-2xl border border-slate-800 shadow-2xl">
                                    <h2 className="text-base font-black text-amber-500 mb-6 border-b border-slate-800 pb-3 flex items-center gap-2">
                                        <i className="fa-solid fa-microchip"></i> DATA PROYEK & AI BLUEPRINT VISION
                                    </h2>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                        {/* KOLOM UPLOAD MOCK AI */}
                                        <div className="space-y-3">
                                            <h3 className="text-xs font-bold text-emerald-400 uppercase"><i className="fa-solid fa-scan-line mr-1"></i> Analisa Gambar Denah</h3>
                                            <p className="text-[10px] text-slate-400">Unggah sketsa denah. Sistem otomatis memindai bahan, tenaga, durasi waktu, dan dimensi (P, L, T).</p>
                                            
                                            <div className="relative w-full h-80 border-2 border-dashed border-slate-700 bg-[#0b0f19] rounded-xl hover:border-amber-500 transition-colors flex flex-col items-center justify-center overflow-hidden cursor-pointer">
                                                <input type="file" accept="image/*" onChange={handleImageUpload} className="absolute inset-0 opacity-0 cursor-pointer z-20" />
                                                
                                                {blueprintImg ? (
                                                    <div className="absolute inset-0 z-10 bg-slate-950 flex flex-col justify-center">
                                                        <img src={blueprintImg} alt="Blueprint" className="w-full h-full object-contain p-2 opacity-80" />
                                                        {isAnalyzing && (
                                                            <div className="absolute inset-0 bg-emerald-900/70 flex flex-col items-center justify-center backdrop-blur-sm">
                                                                <i className="fa-solid fa-spinner fa-spin text-4xl text-emerald-400 mb-3"></i>
                                                                <span className="text-sm font-bold text-white bg-slate-900 px-4 py-1.5 rounded-full shadow-lg">AI Menganalisa Denah...</span>
                                                            </div>
                                                        )}
                                                        {analysisDone && (
                                                            <div className="absolute bottom-3 left-3 right-3 bg-emerald-500 text-slate-950 text-[11px] font-black p-2.5 rounded-lg text-center shadow-xl">
                                                                <i className="fa-solid fa-check-circle mr-1.5"></i> Analisa Dimensi & RAB Selesai!
                                                            </div>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <div className="flex flex-col items-center justify-center text-slate-500 pointer-events-none">
                                                        <i className="fa-solid fa-cloud-arrow-up text-4xl mb-2"></i>
                                                        <span className="text-xs font-bold">Klik / Tarik Gambar Kesini</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* KOLOM TEKS PROYEK */}
                                        <div className="space-y-4">
                                            <h3 className="text-xs font-bold text-emerald-400 uppercase"><i className="fa-solid fa-file-signature mr-1"></i> Detail Administrasi</h3>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nama Proyek</label>
                                                <input type="text" value={projectData.name} onChange={e => setProjectData({...projectData, name: e.target.value})} 
                                                    className="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:border-amber-500 outline-none"/>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Lokasi Proyek</label>
                                                <input type="text" value={projectData.location} onChange={e => setProjectData({...projectData, location: e.target.value})} 
                                                    className="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:border-amber-500 outline-none"/>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nama Pemilik / Klien</label>
                                                <input type="text" value={projectData.owner} onChange={e => setProjectData({...projectData, owner: e.target.value})} 
                                                    className="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:border-amber-500 outline-none"/>
                                            </div>
                                        </div>
                                    </div>

                                    <h3 className="text-xs font-black text-emerald-400 mb-3 border-b border-slate-800 pb-2 uppercase">
                                        <i className="fa-solid fa-ruler-combined mr-1"></i> Ukuran & Jumlah Lantai Bangunan
                                    </h3>
                                    
                                    <div className="mb-4 bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-[10px] font-mono text-amber-300">
                                        P = Panjang (m) | L = Lebar (m) | T = Tinggi (m) | N = Jumlah Titik Kolom | JL = Jumlah Lantai
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Panjang (P)</label>
                                            <input type="number" value={calcFields.p} onChange={e => setCalcFields({...calcFields, p: e.target.value})} 
                                                className="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-2.5 text-xs text-white font-bold text-center outline-none focus:border-emerald-500"/>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Lebar (L)</label>
                                            <input type="number" value={calcFields.l} onChange={e => setCalcFields({...calcFields, l: e.target.value})} 
                                                className="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-2.5 text-xs text-white font-bold text-center outline-none focus:border-emerald-500"/>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tinggi (T)</label>
                                            <input type="number" value={calcFields.t} onChange={e => setCalcFields({...calcFields, t: e.target.value})} 
                                                className="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-2.5 text-xs text-white font-bold text-center outline-none focus:border-emerald-500"/>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">N (Titik Kolom)</label>
                                            <input type="number" value={calcFields.n} onChange={e => setCalcFields({...calcFields, n: e.target.value})} 
                                                className="w-full bg-[#0b0f19] border border-slate-700 rounded-xl p-2.5 text-xs text-white font-bold text-center outline-none focus:border-emerald-500"/>
                                        </div>
                                        <div className="col-span-2 md:col-span-1">
                                            <label className="block text-[10px] font-bold text-amber-400 uppercase mb-1">JL (JML LANTAI)</label>
                                            <select value={calcFields.floors} onChange={e => setCalcFields({...calcFields, floors: e.target.value})}
                                                className="w-full bg-amber-500/20 border-2 border-amber-500 rounded-xl p-2 text-xs text-amber-300 font-black text-center outline-none">
                                                <option value="1" className="bg-slate-900 text-white">1 Lantai (Standar)</option>
                                                <option value="2" className="bg-slate-900 text-white">2 Lantai (Bertingkat)</option>
                                                <option value="3" className="bg-slate-900 text-white">3 Lantai (Bertingkat)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button onClick={() => setActiveTab('calc')} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition uppercase tracking-wide">
                                        <i className="fa-solid fa-rocket mr-2"></i> Lanjutkan Ke Kalkulator Visual & Rumus
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: VISUAL, CALCULATOR & RUMUS EDUKASI */}
                        {activeTab === 'calc' && (
                            <div className="flex-1 flex flex-col lg:flex-row overflow-hidden print-hide">
                                
                                {/* SIDEBAR NAV TAHAPAN & TIMELINE */}
                                <aside className="w-full lg:w-[280px] bg-[#131d33] border-b lg:border-b-0 lg:border-r border-slate-800 p-3 shrink-0 overflow-y-auto">
                                    <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 mt-2 ml-2">⏳ Timeline Pelaksanaan</h3>
                                    <div className="relative">
                                        <div className="absolute left-[20px] top-2 bottom-4 w-0.5 bg-slate-800 rounded-full z-0 hidden lg:block"></div>
                                        <div className="flex lg:flex-col gap-2 overflow-x-auto lg:overflow-visible pb-2 lg:pb-0">
                                            {timeline.map((s, index) => (
                                                <div key={s.id} className="flex flex-col lg:flex-row items-center gap-2 lg:gap-3 relative shrink-0 w-36 lg:w-auto group">
                                                    {activeStage === s.id && index < timeline.length - 1 && (
                                                        <div className="hidden lg:block absolute left-[19px] top-6 w-1 h-[120%] bg-amber-500 animate-pulse z-0 rounded-full"></div>
                                                    )}
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-[11px] shrink-0 z-10 transition-all border-2 ${
                                                        activeStage === s.id ? 'bg-amber-500 border-amber-300 text-slate-950 shadow-[0_0_10px_#f59e0b]' : 'bg-[#0b0f19] border-slate-700 text-slate-400'
                                                    }`}>
                                                        {s.num}
                                                    </div>
                                                    <button onClick={() => setActiveStage(s.id)}
                                                        className={`w-full text-center lg:text-left py-2 px-2 rounded-xl transition ${
                                                            activeStage === s.id ? 'bg-[#0b0f19] border border-amber-500/50 shadow-md' : 'bg-transparent border border-transparent hover:bg-[#0b0f19]'
                                                        }`}>
                                                        <span className={`block text-[11px] font-bold truncate ${activeStage === s.id ? 'text-amber-400' : 'text-slate-300'}`}>{s.name}</span>
                                                        <span className={`block text-[9px] mt-0.5 font-mono ${activeStage === s.id ? 'text-emerald-400' : 'text-slate-500'}`}>Hari {s.startDay}-{s.endDay}</span>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </aside>

                                {/* CENTER MAIN CONTENT */}
                                <main className="flex-1 p-4 overflow-y-auto flex flex-col gap-4 bg-[#0a0d14]">
                                    
                                    {/* OPSI MATERIAL DROPDOWN */}
                                    <div className="bg-[#131d33] p-3 rounded-2xl border border-slate-800 flex flex-wrap items-center gap-3">
                                        <span className="text-amber-400 font-bold text-xs"><i className="fa-solid fa-sliders mr-1"></i> Opsi Spesifikasi:</span>
                                        {activeStage === 'wall' && (
                                            <select value={config.dinding} onChange={e => setConfig({...config, dinding: e.target.value})} className="bg-[#0b0f19] border border-slate-700 text-amber-300 font-bold p-1.5 rounded-xl outline-none text-xs">
                                                <option value="hebel">Bata Ringan / Hebel</option>
                                                <option value="bata_merah">Bata Merah Press</option>
                                                <option value="batako">Batako Pres</option>
                                            </select>
                                        )}
                                        {activeStage === 'roof' && (
                                            <select value={config.atap} onChange={e => setConfig({...config, atap: e.target.value})} className="bg-[#0b0f19] border border-slate-700 text-amber-300 font-bold p-1.5 rounded-xl outline-none text-xs">
                                                <option value="spandek_baja">Baja Ringan + Spandek</option>
                                                <option value="genteng_baja">Baja Ringan + Genteng Keramik</option>
                                                <option value="metal_baja">Baja Ringan + Atap Metal</option>
                                            </select>
                                        )}
                                        {activeStage === 'ceiling' && (
                                            <select value={config.plafon} onChange={e => setConfig({...config, plafon: e.target.value})} className="bg-[#0b0f19] border border-slate-700 text-amber-300 font-bold p-1.5 rounded-xl outline-none text-xs">
                                                <option value="gypsum">Gypsum 9mm + Rangka Hollow</option>
                                                <option value="pvc">Plafon PVC Premium + Rangka</option>
                                            </select>
                                        )}
                                        {activeStage === 'floor' && (
                                            <select value={config.lantai} onChange={e => setConfig({...config, lantai: e.target.value})} className="bg-[#0b0f19] border border-slate-700 text-amber-300 font-bold p-1.5 rounded-xl outline-none text-xs">
                                                <option value="granit_60">Granit Tile 60x60 cm</option>
                                                <option value="keramik_50">Keramik 50x50 cm</option>
                                                <option value="vinyl">Vinyl Plank 3mm</option>
                                            </select>
                                        )}
                                        <span className="text-slate-400 text-[10px] ml-auto">
                                            Modus Bangunan: <b className="text-emerald-400">{calcFields.floors} Lantai (JL={calcFields.floors})</b>
                                        </span>
                                    </div>

                                    {/* DUA RUMUS KOMPARASI (RUMUS 1 LANTAI VS RUMUS BERTINGKAT) - PALING ATAS! */}
                                    <div className="bg-[#131d33] p-4 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                                        <h3 className="text-xs font-black text-amber-400 uppercase tracking-wider flex items-center gap-2">
                                            <i className="fa-solid fa-graduation-cap text-base"></i> EDUKASI RUMUS PERHITUNGAN VOLUMETRIK
                                        </h3>
                                        
                                        <div className="bg-slate-900 border border-slate-700 p-3 rounded-lg mb-2">
                                            <p className="text-emerald-400 font-bold text-[11px] mb-1">Pengertian & Fungsi:</p>
                                            <p className="text-white text-[10px] leading-relaxed">{currentFormula?.pengertian}</p>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {/* RUMUS 1 LANTAI - FONT DIUBAH KE SANS-SERIF YB MUDAH DIBACA */}
                                            <div className={`p-3 rounded-xl border ${!isMultiStory ? 'bg-amber-500/10 border-amber-500/50' : 'bg-[#0b0f19] border-slate-800'}`}>
                                                <p className="font-bold text-amber-300 text-[11px] mb-2 flex items-center gap-1">
                                                    <span className="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-[9px]">1</span> Rumus Standar (Bangunan 1 Lantai / JL=1):
                                                </p>
                                                <p className="font-sans text-white font-bold bg-[#0a0d14] p-3 rounded-lg border border-slate-800 text-[12px] mb-2 tracking-wide shadow-inner">
                                                    {currentFormula?.formula1}
                                                </p>
                                                <p className="text-[10px] text-slate-400 leading-relaxed border-t border-slate-800/50 pt-2"><i className="fa-solid fa-circle-info text-amber-500/70 mr-1"></i> {currentFormula?.note1}</p>
                                            </div>

                                            {/* RUMUS BERTINGKAT - FONT DIUBAH KE SANS-SERIF YG MUDAH DIBACA */}
                                            <div className={`p-3 rounded-xl border ${isMultiStory ? 'bg-emerald-500/10 border-emerald-500/50' : 'bg-[#0b0f19] border-slate-800'}`}>
                                                <p className="font-bold text-emerald-400 text-[11px] mb-2 flex items-center gap-1">
                                                    <span className="bg-emerald-500 text-slate-950 px-1.5 py-0.5 rounded text-[9px]">2</span> Rumus Bertingkat (≥2 Lantai / JL &gt; 1):
                                                </p>
                                                <p className="font-sans text-white font-bold bg-[#0a0d14] p-3 rounded-lg border border-slate-800 text-[12px] mb-2 tracking-wide shadow-inner">
                                                    {currentFormula?.formulaMulti}
                                                </p>
                                                <p className="text-[10px] text-slate-400 leading-relaxed border-t border-slate-800/50 pt-2"><i className="fa-solid fa-triangle-exclamation text-emerald-500/70 mr-1"></i> {currentFormula?.noteMulti}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* DIAGRAM VISUAL (DENGAN GAMBAR 3D DETIL YANG DIKEMBALIKAN) */}
                                    <StageVisualizer stageId={activeStage} fields={calcFields} viewMode={viewMode} setViewMode={setViewMode} config={config} />

                                    {/* 3 KOTAK BIAYA DI BAWAH GAMBAR */}
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 shrink-0">
                                        <div className="bg-[#131d33] border border-slate-800 p-4 rounded-2xl shadow-lg relative overflow-hidden">
                                            <div className="absolute -right-4 -bottom-4 opacity-5 text-6xl"><i className="fa-solid fa-box-open"></i></div>
                                            <p className="text-[10px] text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-1">
                                                <i className="fa-solid fa-box-open text-blue-400"></i> Biaya Material
                                            </p>
                                            <span className="text-lg md:text-xl font-black text-white">{formatIDR(stageResult.totalMat)}</span>
                                        </div>
                                        <div className="bg-[#131d33] border border-slate-800 p-4 rounded-2xl shadow-lg relative overflow-hidden">
                                            <div className="absolute -right-4 -bottom-4 opacity-5 text-6xl"><i className="fa-solid fa-users"></i></div>
                                            <p className="text-[10px] text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-1">
                                                <i className="fa-solid fa-users text-amber-400"></i> Upah Pekerja
                                            </p>
                                            <span className="text-lg md:text-xl font-black text-amber-400">{formatIDR(stageResult.totalLab)}</span>
                                        </div>
                                        <div className="bg-emerald-900/20 border border-emerald-500/40 p-4 rounded-2xl shadow-lg relative overflow-hidden">
                                            <div className="absolute -right-4 -bottom-4 opacity-10 text-emerald-500 text-6xl"><i className="fa-solid fa-money-bill-wave"></i></div>
                                            <p className="text-[10px] text-emerald-400 uppercase tracking-widest mb-1 font-bold">Subtotal Tahap</p>
                                            <span className="text-lg md:text-xl font-black text-emerald-400">{formatIDR(stageResult.grandTotal)}</span>
                                        </div>
                                    </div>
                                </main>

                                {/* RIGHT SIDEBAR: RINGKASAN KEBUTUHAN */}
                                <aside className="w-full lg:w-[320px] bg-[#131d33] border-t lg:border-t-0 lg:border-l border-slate-800 p-4 shrink-0 overflow-y-auto">
                                    <h3 className="text-xs font-black text-white uppercase tracking-widest mb-3 border-b border-slate-800 pb-2">Rincian Hasil Kebutuhan</h3>

                                    <div className="bg-[#0b0f19] p-3 rounded-xl border border-slate-800 mb-4 flex justify-between items-center shadow-inner">
                                        <span className="text-slate-400 font-bold">Total Vol Pekerjaan:</span>
                                        <span className="text-lg font-black text-emerald-400">{formatVol(stageResult.volume)} <span className="text-[10px] text-slate-400 font-normal">{STAGES.find(s=>s.id===activeStage)?.unit}</span></span>
                                    </div>

                                    <p className="font-bold text-amber-400 uppercase text-[10px] mb-2 flex items-center gap-1"><i className="fa-solid fa-cubes"></i> Kebutuhan Material:</p>
                                    <div className="space-y-2 mb-4">
                                        {stageResult.materials.length === 0 && <p className="text-slate-500 text-[10px] p-2 bg-[#0b0f19] rounded-lg text-center">Tidak memerlukan material khusus.</p>}
                                        {stageResult.materials.map((m, i) => (
                                            <div key={i} className="bg-[#0b0f19] p-2.5 rounded-xl border border-slate-800 flex justify-between items-center hover:border-slate-600 transition">
                                                <div>
                                                    <p className="font-bold text-white text-[10px] leading-tight mb-0.5">{m.name}</p>
                                                    <p className="text-[9px] text-slate-400 font-mono bg-slate-900 px-1 rounded inline-block">Bth: <span className="text-amber-400">{formatVol(m.qty)} {m.unit}</span> @ {formatIDR(m.price)}</p>
                                                </div>
                                                <span className="font-black text-emerald-400 text-[11px] ml-2 shrink-0">{formatIDR(m.total)}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <p className="font-bold text-amber-400 uppercase text-[10px] mb-2 flex items-center gap-1"><i className="fa-solid fa-helmet-safety"></i> Kebutuhan Upah Pekerja:</p>
                                    <div className="space-y-2 mb-4">
                                        {stageResult.labor.map((l, i) => (
                                            <div key={i} className="bg-[#0b0f19] p-2.5 rounded-xl border border-slate-800 flex justify-between items-center hover:border-slate-600 transition">
                                                <div>
                                                    <p className="font-bold text-white text-[10px] leading-tight mb-0.5">{l.name}</p>
                                                    <p className="text-[9px] text-slate-400 font-mono bg-slate-900 px-1 rounded inline-block">Bth: <span className="text-blue-300">{l.qty} OH</span> @ {formatIDR(l.price)}</p>
                                                </div>
                                                <span className="font-black text-amber-400 text-[11px] ml-2 shrink-0">{formatIDR(l.total)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </aside>
                            </div>
                        )}

                        {/* TAB 3: RAB PER TAHAP */}
                        {activeTab === 'rab_stage' && (
                            <div className="flex-1 p-6 overflow-y-auto print-container">
                                <div className="max-w-4xl mx-auto space-y-4">
                                    <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                                        <h2 className="text-base font-black text-white print-text-dark uppercase">📑 RINCIAN RAB PER TAHAP PEKERJAAN</h2>
                                        <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold print-hide shadow-md">
                                            <i className="fa-solid fa-print mr-1"></i> Cetak / SIMPAN PDF
                                        </button>
                                    </div>

                                    {STAGES.map((s) => {
                                        const vol = calculateVolume(s.id, calcFields);
                                        const coef = getCoefficients(s.id, config, parseInt(calcFields.floors));
                                        let stageMat = 0, stageLab = 0;
                                        const mats = coef.materials.map(m => {
                                            const db = prices.materials[m.id];
                                            if (!db) return null;
                                            const q = m.qty * vol;
                                            const cost = Math.round(q * db.price);
                                            stageMat += cost;
                                            return { name: db.name, qty: q, unit: db.unit, price: db.price, total: cost };
                                        }).filter(Boolean);

                                        const labs = coef.labor.map(l => {
                                            const db = prices.labor[l.id];
                                            if (!db) return null;
                                            const q = Math.ceil(l.qty * vol);
                                            const cost = q * db.price;
                                            stageLab += cost;
                                            return { name: db.name, qty: q, unit: db.unit, price: db.price, total: cost };
                                        }).filter(Boolean);

                                        return (
                                            <div key={s.id} className="bg-[#131d33] print-bg-light p-5 rounded-2xl border border-slate-800 print-border shadow-lg page-break-inside-avoid">
                                                <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                                                    <div>
                                                        <h3 className="font-black text-amber-400 print-text-dark text-sm">{s.num}. {s.name}</h3>
                                                        <p className="text-[10px] text-slate-400 mt-0.5">Volume Pekerjaan: <span className="font-bold text-emerald-400">{formatVol(vol)} {s.unit}</span></p>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-[9px] text-slate-400 uppercase tracking-widest block">Total Biaya Tahap</span>
                                                        <span className="font-black text-emerald-400 print-text-dark text-lg">{formatIDR(stageMat + stageLab)}</span>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-[11px]">
                                                    <div className="bg-[#0b0f19] print-bg-light p-3 rounded-xl border border-slate-800">
                                                        <p className="font-bold text-slate-400 uppercase mb-2 border-b border-slate-800/50 pb-1">Bahan Material:</p>
                                                        {mats.map((m, i) => (
                                                            <div key={i} className="flex justify-between py-1 border-b border-slate-800/40">
                                                                <span className="text-slate-300 print-text-dark">{m.name} ({formatVol(m.qty)} {m.unit})</span>
                                                                <span className="text-white print-text-dark font-mono">{formatIDR(m.total)}</span>
                                                            </div>
                                                        ))}
                                                        <div className="flex justify-between pt-2 mt-1 font-bold text-blue-400">
                                                            <span>Subtotal Material</span>
                                                            <span>{formatIDR(stageMat)}</span>
                                                        </div>
                                                    </div>
                                                    <div className="bg-[#0b0f19] print-bg-light p-3 rounded-xl border border-slate-800">
                                                        <p className="font-bold text-slate-400 uppercase mb-2 border-b border-slate-800/50 pb-1">Upah Tenaga:</p>
                                                        {labs.map((l, i) => (
                                                            <div key={i} className="flex justify-between py-1 border-b border-slate-800/40">
                                                                <span className="text-slate-300 print-text-dark">{l.name} ({l.qty} OH)</span>
                                                                <span className="text-white print-text-dark font-mono">{formatIDR(l.total)}</span>
                                                            </div>
                                                        ))}
                                                        <div className="flex justify-between pt-2 mt-1 font-bold text-amber-400">
                                                            <span>Subtotal Upah</span>
                                                            <span>{formatIDR(stageLab)}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: RAB GLOBAL */}
                        {activeTab === 'rab_global' && (
                            <div className="flex-1 p-6 overflow-y-auto print-container">
                                <div className="max-w-5xl mx-auto bg-[#131d33] print-bg-light p-6 rounded-2xl border border-slate-800 print-border shadow-2xl">
                                    <div className="border-b border-slate-800 pb-4 mb-5 flex flex-col md:flex-row justify-between items-start md:items-end gap-3">
                                        <div>
                                            <h2 className="text-xl font-black text-white print-text-dark uppercase mb-1">REKAPITULASI RAB GLOBAL</h2>
                                            <p className="text-slate-400 print-text-dark text-xs">Proyek: <b className="text-amber-400 print-text-dark">{projectData.name}</b></p>
                                            <p className="text-slate-400 print-text-dark text-xs">Pemilik: {projectData.owner} | Dimensi: {calcFields.p}x{calcFields.l}m | {calcFields.floors} Lantai</p>
                                        </div>
                                        <div className="flex flex-col items-end gap-2 w-full md:w-auto">
                                            <div className="flex gap-2 print-hide">
                                                <button onClick={exportToCSV} className="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md">
                                                    <i className="fa-solid fa-file-excel mr-1"></i> Ekspor CSV
                                                </button>
                                                <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md">
                                                    <i className="fa-solid fa-print mr-1"></i> Cetak PDF
                                                </button>
                                            </div>
                                            <div className="text-right mt-2">
                                                <p className="text-[10px] text-slate-400 uppercase tracking-widest mb-0.5">Grand Total Proyek</p>
                                                <p className="text-2xl font-black text-emerald-400">{formatIDR(globalRAB.grandTotal)}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="overflow-hidden rounded-xl border border-slate-800">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-[#0b0f19] text-[10px] uppercase text-slate-400 tracking-wider">
                                                    <th className="p-3 border-b border-slate-800 w-10 text-center">No</th>
                                                    <th className="p-3 border-b border-slate-800">Uraian Pekerjaan</th>
                                                    <th className="p-3 border-b border-slate-800 text-center">Volume</th>
                                                    <th className="p-3 border-b border-slate-800 text-right">Biaya Material</th>
                                                    <th className="p-3 border-b border-slate-800 text-right">Biaya Upah</th>
                                                    <th className="p-3 border-b border-slate-800 text-right font-bold text-white print-text-dark">Subtotal (Rp)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="text-xs">
                                                {globalRAB.details.map((row, idx) => (
                                                    <tr key={row.id} className="border-b border-slate-800/60 hover:bg-slate-800/30 transition">
                                                        <td className="p-3 text-center text-slate-500 font-bold">{idx + 1}</td>
                                                        <td className="p-3 font-bold text-slate-200 print-text-dark">{row.name}</td>
                                                        <td className="p-3 text-center text-emerald-400 font-mono bg-emerald-900/10">{formatVol(row.volume)} <span className="text-[10px]">{row.unit}</span></td>
                                                        <td className="p-3 text-right text-slate-300 print-text-dark font-mono">{formatIDR(row.matCost)}</td>
                                                        <td className="p-3 text-right text-slate-300 print-text-dark font-mono">{formatIDR(row.labCost)}</td>
                                                        <td className="p-3 text-right font-bold text-amber-400 print-text-dark font-mono bg-amber-900/10">{formatIDR(row.totalCost)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                            <tfoot>
                                                <tr className="bg-[#0b0f19] font-black text-sm border-t-2 border-slate-700">
                                                    <td colSpan="3" className="p-4 text-right uppercase text-white print-text-dark">TOTAL REKAPITULASI BIAYA</td>
                                                    <td className="p-4 text-right text-blue-400 font-mono">{formatIDR(globalRAB.totalMatAll)}</td>
                                                    <td className="p-4 text-right text-amber-400 font-mono">{formatIDR(globalRAB.totalLabAll)}</td>
                                                    <td className="p-4 text-right text-emerald-400 font-mono text-base bg-emerald-900/20">{formatIDR(globalRAB.grandTotal)}</td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: DATABASE MATERIAL */}
                        {activeTab === 'materials' && (
                            <div className="flex-1 p-6 overflow-y-auto print-hide">
                                <div className="max-w-4xl mx-auto bg-[#131d33] p-6 rounded-2xl border border-slate-800 shadow-2xl">
                                    <h2 className="text-lg font-black text-amber-500 mb-2 uppercase flex items-center gap-2">
                                        <i className="fa-solid fa-database"></i> Database Harga Material & Upah Realtime
                                    </h2>
                                    <p className="text-slate-400 text-xs mb-6 pb-4 border-b border-slate-800">Perbarui harga satuan di bawah ini. Semua kalkulasi di menu RAB akan otomatis menyesuaikan.</p>
                                    
                                    <div className="space-y-8">
                                        <div>
                                            <h3 className="text-sm font-black text-white uppercase mb-3 bg-[#0b0f19] p-2 rounded-lg inline-block border border-slate-700">
                                                <i className="fa-solid fa-users-gear text-amber-500 mr-2"></i> Upah Tenaga Kerja (Per OH)
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {Object.entries(prices.labor).map(([key, item]) => (
                                                    <div key={key} className="flex justify-between items-center bg-[#0b0f19] p-2.5 rounded-xl border border-slate-800 hover:border-slate-600 transition">
                                                        <span className="text-[11px] font-bold text-slate-300">{item.name}</span>
                                                        <div className="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 shadow-inner">
                                                            <span className="text-[10px] text-slate-500 font-bold">Rp</span>
                                                            <input type="number" value={item.price} onChange={(e) => handlePriceChange('labor', key, e.target.value)}
                                                                className="w-24 bg-transparent text-right text-amber-400 font-mono text-sm py-1 outline-none font-bold"/>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-sm font-black text-white uppercase mb-3 bg-[#0b0f19] p-2 rounded-lg inline-block border border-slate-700">
                                                <i className="fa-solid fa-cubes-stacked text-blue-400 mr-2"></i> Harga Material Bangunan
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                                {Object.entries(prices.materials).map(([key, item]) => (
                                                    <div key={key} className="flex flex-col gap-2 bg-[#0b0f19] p-3 rounded-xl border border-slate-800 hover:border-slate-600 transition">
                                                        <div className="flex justify-between items-start">
                                                            <span className="text-[11px] font-bold text-slate-300 leading-tight pr-2">{item.name}</span>
                                                            <span className="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-bold shrink-0">{item.unit}</span>
                                                        </div>
                                                        <div className="flex items-center justify-between mt-auto">
                                                            <span className="text-[10px] text-slate-500 font-bold">Harga:</span>
                                                            <div className="flex items-center gap-1.5 bg-slate-900 border border-slate-700 rounded-lg px-2 shadow-inner">
                                                                <span className="text-[10px] text-slate-500 font-bold">Rp</span>
                                                                <input type="number" value={item.price} onChange={(e) => handlePriceChange('materials', key, e.target.value)}
                                                                    className="w-24 bg-transparent text-right text-emerald-400 font-mono text-[13px] py-1 outline-none font-black"/>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
